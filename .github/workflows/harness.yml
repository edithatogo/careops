name: Harness gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Run fail-closed harness
        shell: pwsh
        run: ./harness/Test-Harness.ps1
