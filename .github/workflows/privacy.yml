name: Privacy protection
permissions:
  contents: read
concurrency:
  group: privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  privacy:
    name: Privacy and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        submodules: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      id: runtime
      with:
        python-version: 3.15.1
    - name: Select verified repository-local Python
      env:
        SELECTED_PYTHON: ${{ steps.runtime.outputs.python-path }}
        EXPECTED_PYTHON: 3.15.1
      run: 'test ! -e .venv-careops-privacy

        "$SELECTED_PYTHON" -I -m venv .venv-careops-privacy

        .venv-careops-privacy/bin/python -I -c ''import pathlib, sys; assert sys.version_info[:3] == (3,15,1); assert pathlib.Path(sys.prefix).resolve() == pathlib.Path(".venv-careops-privacy").resolve(); assert sys.prefix != sys.base_prefix; print(sys.version)''

        '
    - name: Test privacy rejection and staged-content handling
      run: .venv-careops-privacy/bin/python -I -m unittest discover -s .careops-security -p test_check.py -v
    - name: Verify inventory and changed content
      env:
        BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: "if [[ \"$BASE_REVISION\" =~ ^[a-f0-9]{40}$ ]] && [[ \"$BASE_REVISION\" != 0000000000000000000000000000000000000000 ]]; then\n  base=$(git merge-base HEAD \"$BASE_REVISION\")\n  .venv-careops-privacy/bin/python -I .careops-security/check.py --base \"$base\"\nelse\n  .venv-careops-privacy/bin/python -I .careops-security/check.py --all\nfi\n"
    - name: Scan complete history with verified Gitleaks
      env:
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: "curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o \"$RUNNER_TEMP/gitleaks.tar.gz\"\necho \"$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz\" | sha256sum --check\ntar -xzf \"$RUNNER_TEMP/gitleaks.tar.gz\" -C \"$RUNNER_TEMP\" gitleaks\nif ! \"$RUNNER_TEMP/gitleaks\" git . --log-opts=--all --gitleaks-ignore-path .careops-security/gitleaks-reviewed.ignore --ignore-gitleaks-allow --redact --no-banner > \"$RUNNER_TEMP/privacy-gitleaks.log\" 2>&1; then\n  echo 'Secret scan failed. Inspect locally with redaction; matched content is withheld from CI logs.' >&2\n  exit 1\nfi\n"
    - name: Install exact offline privacy model and tools
      run: 'test ! -e .venv-careops-presidio

        .venv-careops-privacy/bin/python -I -m venv .venv-careops-presidio

        .venv-careops-presidio/bin/python -I -m pip install --require-hashes --only-binary=:all: --no-binary=PyYAML -r .careops-security/requirements-presidio.lock'
    - name: Qualify offline semantic privacy rejection
      run: '.venv-careops-privacy/bin/python -I -m unittest discover -s .careops-security -p test_presidio.py -v

        .venv-careops-presidio/bin/python -I .careops-security/qualify_presidio.py'
    - name: Test public CI semantic scope and private-push separation
      run: .venv-careops-privacy/bin/python -I -m unittest discover -s .careops-security -p test_ci_public_privacy.py -v
    - name: Verify public CI source identity and offline semantic privacy range
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_revision }}
        TIP_REVISION: ${{ github.sha }}
      run: "if ! [[ \"$BASE_REVISION\" =~ ^[a-f0-9]{40}$ ]] || [[ \"$BASE_REVISION\" == 0000000000000000000000000000000000000000 ]]; then\n  echo 'Explicit valid base revision required; privacy range not verified.' >&2\n  exit 1\nfi\nif ! [[ \"$TIP_REVISION\" =~ ^[a-f0-9]{40}$ ]]; then\n  echo 'Explicit valid tip revision required; privacy range not verified.' >&2\n  exit 1\nfi\ngit merge-base --is-ancestor \"$BASE_REVISION\" \"$TIP_REVISION\"\n.venv-careops-privacy/bin/python -I .careops-security/ci_public_privacy.py --ci-base \"$BASE_REVISION\" --ci-tip \"$TIP_REVISION\""
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      base_revision:
        description: Exact reviewed ancestor SHA for the offline privacy range
        required: true
        type: string
