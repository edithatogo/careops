name: Regenerate CI lock candidate
on:
  pull_request:
    paths:
      - requirements-ci.txt
      - requirements-ci.lock
      - portfolio-scripts/ci_delivery.py
      - .github/workflows/lock-refresh.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-lock-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lock:
    name: Automatic hash-lock regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          "$SELECTED_PYTHON" -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Regenerate lock and dependency inventory automatically
        run: |
          mkdir -p .local/lock-refresh
          python portfolio-scripts/ci_delivery.py lock --output requirements-ci.lock --receipt .local/lock-refresh/receipt.json
          python portfolio-scripts/inventory_dependencies.py --root . > portfolio/dependency-inventory.json
          cp requirements-ci.lock .local/lock-refresh/requirements-ci.lock
          cp portfolio/dependency-inventory.json .local/lock-refresh/dependency-inventory.json
          git diff -- requirements-ci.lock portfolio/dependency-inventory.json > .local/lock-refresh/lock-update.patch
      - name: Verify regenerated lock consistency and installability
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m unittest discover -s portfolio-scripts/checks -v
      - name: Require qualified generated files in the source commit
        run: git diff --exit-code -- requirements-ci.lock portfolio/dependency-inventory.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-lock-candidate
          path: .local/lock-refresh/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
