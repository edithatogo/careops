name: Credentialing cross-module compatibility

on:
  pull_request:
    paths: ['.github/workflows/credentialing-cross-module.yml', 'portfolio/public-runtime-compatibility.json', 'scripts/qualify_public_module_runtime.py', 'scripts/validate_credentialing_release_pins.py', 'PUBLIC_SOURCE_FILES.json', 'careops-approve/**', 'modules/careops-process/**', 'scripts/integrated_module_source.py', '.gitmodules']
  push:
    branches: [main]
    paths: ['.github/workflows/credentialing-cross-module.yml', 'portfolio/public-runtime-compatibility.json', 'scripts/qualify_public_module_runtime.py', 'scripts/validate_credentialing_release_pins.py', 'PUBLIC_SOURCE_FILES.json', 'careops-approve/**', 'modules/careops-process/**', 'scripts/integrated_module_source.py', '.gitmodules']
  schedule:
    - cron: '31 5 * * 4'
  workflow_dispatch:

# Current Process/Approve qualification uses integrated source only. Historical
# release receipts remain immutable; no archived repository is an active CI input.

permissions:
  contents: read

concurrency:
  group: credentialing-cross-module-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-runtime:
    name: Public declared boundary and Process runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python 3.15.1
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - name: Verify paired parent source pins before consumer checkout
        run: python scripts/validate_credentialing_release_pins.py
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Install Process from its frozen runtime and build lock
        id: install
        run: |
          uv sync --project modules/careops-process --python 3.15.1 --frozen --no-dev --group build --no-install-project
          uv sync --project modules/careops-process --python 3.15.1 --frozen --no-dev --group build --no-build-isolation --no-editable
      - name: Exercise the actual consumer and declared source boundary
        id: qualification
        run: modules/careops-process/.venv/bin/python scripts/qualify_public_module_runtime.py --module-root . --receipt dist/public-runtime-compatibility.json
      - name: Record terminal execution outcomes
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
        run: |
          if [ ! -x "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" ]; then
            mkdir -p dist
            printf '%s\n' '{"passed":false,"producerRuntimeQualified":false,"productionWrites":false,"setupFailure":"helper-environment-unavailable"}' > dist/public-runtime-compatibility.json
            exit 1
          fi
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('dist/public-runtime-compatibility.json')
          value = json.loads(path.read_text()) if path.exists() else {
              'passed': False, 'producerRuntimeQualified': False,
              'productionWrites': False, 'setupFailure': 'qualification-not-executed',
          }
          value['parentRevision'] = os.environ['GITHUB_SHA']
          value['installOutcome'] = os.environ['INSTALL_OUTCOME']
          value['qualificationOutcome'] = os.environ['QUALIFICATION_OUTCOME']
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n')
          PY
      - name: Retain scoped results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-runtime-compatibility
          path: dist/public-runtime-compatibility.json
          if-no-files-found: error
          retention-days: 14
