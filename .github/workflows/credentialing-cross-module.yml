name: Credentialing cross-module compatibility

on:
  pull_request:
    paths: ['.github/workflows/credentialing-cross-module.yml', 'portfolio/public-runtime-compatibility.json', 'scripts/qualify_public_module_runtime.py', 'scripts/validate_credentialing_release_pins.py', 'PUBLIC_SOURCE_FILES.json', 'careops-approve']
  push:
    branches: [main]
    paths: ['.github/workflows/credentialing-cross-module.yml', 'portfolio/public-runtime-compatibility.json', 'scripts/qualify_public_module_runtime.py', 'scripts/validate_credentialing_release_pins.py', 'PUBLIC_SOURCE_FILES.json', 'careops-approve']
  schedule:
    - cron: '31 5 * * 4'
  workflow_dispatch:

# The public slice requires no cross-repository credential. The separate historical
# full release-train check still requires its existing private read credential.

permissions:
  contents: read

concurrency:
  group: credentialing-cross-module-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-runtime:
    name: Public declared boundary and Process runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Check out qualified public Approve source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edithatogo/careops-approve
          ref: 69f35ddcf87b5b5ef0ed1ea7d0932e95ac0960ec
          path: _integration/careops-approve
          fetch-depth: 0
          persist-credentials: false
      - name: Check out qualified public Process source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edithatogo/careops-process
          ref: aec8025c3edb065223a5a73807dd6398fbd42a72
          path: _integration/careops-process
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - name: Install Process from its frozen runtime and build lock
        id: install
        run: |
          uv sync --project _integration/careops-process --python 3.15.0 --frozen --no-dev --group build --no-install-project
          uv sync --project _integration/careops-process --python 3.15.0 --frozen --no-dev --group build --no-build-isolation --no-editable
      - name: Exercise the actual consumer and declared source boundary
        id: qualification
        run: _integration/careops-process/.venv/bin/python scripts/qualify_public_module_runtime.py --module-root _integration --receipt dist/public-runtime-compatibility.json
      - name: Record terminal execution outcomes
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('dist/public-runtime-compatibility.json')
          value = json.loads(path.read_text()) if path.exists() else {
              'passed': False, 'producerRuntimeQualified': False,
              'productionWrites': False, 'setupFailure': 'qualification-not-executed',
          }
          value['parentRevision'] = os.environ['GITHUB_SHA']
          value['installOutcome'] = os.environ['INSTALL_OUTCOME']
          value['qualificationOutcome'] = os.environ['QUALIFICATION_OUTCOME']
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2) + '\n')
          PY
      - name: Retain scoped results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-runtime-compatibility
          path: dist/public-runtime-compatibility.json
          if-no-files-found: error
          retention-days: 14
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.CAREOPS_PRIVATE_INTEGRATION_ENABLED == 'true' }}
    name: Pinned source-contract compatibility on Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the CareOps release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Check out CareOps Approve at its release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CAREOPS_INTEGRATION_TOKEN }}
          repository: edithatogo/careops-approve
          ref: ec7d7230b0fae3293c7ed51e716074074f83b5bb
          path: _integration/careops-approve
          persist-credentials: false
      - name: Check out CareOps Decisions at its release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CAREOPS_INTEGRATION_TOKEN }}
          repository: edithatogo/careops-decisions
          ref: 69aa4e5a1d0851feb0d75900f0dabc618544e66c
          path: _integration/careops-decisions
          persist-credentials: false
      - name: Check out CareOps Process at its release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CAREOPS_INTEGRATION_TOKEN }}
          repository: edithatogo/careops-process
          ref: e31bdd9213178e7996d4bdb6685bba8d83be22f8
          path: _integration/careops-process
          persist-credentials: false
      - name: Check out CareOps Legacy Migration at its release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CAREOPS_INTEGRATION_TOKEN }}
          repository: edithatogo/nsw-health-mscg-powerplatform
          ref: 7316a757028fb44e8f77b35ca14f7b426e2527db
          path: _integration/careops-legacy-migration
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Compile the cross-module harness
        run: python -m compileall -q scripts/validate_cross_module_credentialing_contracts.py
      - name: Validate pinned cross-module contracts
        run: >-
          python scripts/validate_cross_module_credentialing_contracts.py
          --module-root _integration
          --receipt dist/credentialing-cross-module-receipt.json
      - name: Retain the cross-module receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: credentialing-cross-module-receipt
          path: dist/credentialing-cross-module-receipt.json
          retention-days: 14
          if-no-files-found: error
