name: Native Microsoft roadmap integrity
on:
  pull_request:
    paths:
      - 'requirements-ci.*'
      - 'conductor/native-m365-roadmap.md'
      - 'conductor/tracks.md'
      - 'conductor/tracks/native_*_20260923/**'
      - 'portfolio/native-credentialing-target.json'
      - 'scripts/validate_native_roadmap.py'
      - 'tests/native_roadmap/**'
      - '.github/workflows/native-m365-roadmap.yml'
  push:
    branches: [main]
    paths:
      - 'requirements-ci.*'
      - 'conductor/**'
      - 'portfolio/native-credentialing-target.json'
      - 'scripts/validate_native_roadmap.py'
      - 'tests/native_roadmap/**'
      - '.github/workflows/native-m365-roadmap.yml'
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  planning:
    name: Planning integrity (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.15.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: ${{ matrix.python }}
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          "$SELECTED_PYTHON" -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - name: Install pinned static tools
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Strict static checks
        run: |
          python -m ruff check --config tests/native_roadmap/pyproject.toml scripts/validate_native_roadmap.py tests/native_roadmap
          python -m mypy --config-file tests/native_roadmap/pyproject.toml scripts/validate_native_roadmap.py tests/native_roadmap
      - name: Planning regressions and actual track validation
        run: |
          python -m unittest discover -s tests/native_roadmap -v
          python scripts/validate_native_roadmap.py
