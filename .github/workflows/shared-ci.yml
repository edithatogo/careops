name: Shared CI contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: edithatogo/careops/.github/workflows/reusable-source-security.yml@953eba2d4427bc5c35252b589f51c6414d4f717c
    with:
      policy-revision: 953eba2d4427bc5c35252b589f51c6414d4f717c
