name: Credentialing release candidate

on:
  pull_request:
    paths:
      - 'portfolio/credentialing-release-sources.json'
      - 'scripts/build_credentialing_release_candidate.py'
      - 'tests/test_credentialing_release_candidate.py'
      - 'conductor/tracks/credentialing_release_20260910/release-automation.md'
      - '.github/workflows/credentialing-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credentialing-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.15.1 fail-closed tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.15.1
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - name: Compile and test
        run: |
          python -m compileall -q scripts/build_credentialing_release_candidate.py tests/test_credentialing_release_candidate.py
          python -m unittest -v tests/test_credentialing_release_candidate.py

  resolve:
    name: Resolve public repository heads to a review candidate
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.15.1
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - name: Build the non-promoted candidate
        run: |
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/build_credentialing_release_candidate.py \
            --registry portfolio/credentialing-release-sources.json \
            --baseline portfolio/credentialing-mvp-compatibility.json \
            --observed-at "$observed_at" \
            --output /tmp/credentialing-release-candidate.json \
            --receipt /tmp/credentialing-release-candidate-receipt.json
      - name: Retain candidate and receipt for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: credentialing-release-candidate
          path: |
            /tmp/credentialing-release-candidate.json
            /tmp/credentialing-release-candidate-receipt.json
          retention-days: 30
          if-no-files-found: error
