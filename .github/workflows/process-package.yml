name: process-package
'on':
  pull_request:
    paths:
      - modules/careops-process/**
      - .github/workflows/process-package.yml
  push:
    branches:
      - main
    paths:
      - modules/careops-process/**
      - .github/workflows/process-package.yml
  workflow_dispatch:
    inputs:
      native-attestation:
        description: Request formal signed-release qualification after native attestation capability is available; unavailable for user-owned private repos on 2026-11-06.
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: wheel-release-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: modules/careops-process
jobs:
  build:
    name: Reproducible wheel and actual-content inventories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.5
          python-version: 3.15.1
          enable-cache: false
      - name: Install only the locked runtime and exact build backend
        run: |
          uv lock --check
          uv sync --frozen --no-install-project --no-dev --group build
      - name: Build the actual wheel once without network build isolation
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$SOURCE_COMMIT")
          export SOURCE_DATE_EPOCH
          uv build --python .venv/bin/python --wheel --no-build-isolation --out-dir dist
          uv export --frozen --no-dev --no-group build --all-extras --no-emit-project --format cyclonedx1.5 --output-file dist/resolved-dependencies.cdx.json > /dev/null
      - name: Exercise the installed wheel independently of source imports
        run: |
          uv venv --python 3.15.1 "$RUNNER_TEMP/wheel-smoke"
          uv export --frozen --no-dev --no-group build --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/wheel-runtime.lock" > /dev/null
          uv pip sync --python "$RUNNER_TEMP/wheel-smoke/bin/python" --require-hashes "$RUNNER_TEMP/wheel-runtime.lock"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" - <<'PYCODE'
          import os, secrets
          from pathlib import Path
          import careops_process
          assert 'site-packages' in Path(careops_process.__file__).parts
          os.environ['CAREOPS_PSEUDONYM_SECRET'] = secrets.token_hex(32)
          from careops_process.cli import main
          assert main(['--log-id', 'fictional-wheel-qualification']) == 0
          PYCODE
      - name: Read immutable qualified artifact tooling
        shell: bash
        run: |
          set -euo pipefail
          # Exact source edithatogo/careops@30df4953ea87c8915b4a525fc671a4c9857c3f7f; inherited licence retained.
          test ! -e "$GITHUB_WORKSPACE/modules/careops-process/.careops-ci-tools"
          cd "$GITHUB_WORKSPACE/modules/careops-process/.careops-security/upstream/30df4953ea87c8915b4a525fc671a4c9857c3f7f"
          sha256sum --check SHA256SUMS
          mkdir -p "$GITHUB_WORKSPACE/modules/careops-process/.careops-ci-tools"
          cp -R . "$GITHUB_WORKSPACE/modules/careops-process/.careops-ci-tools/"
      - name: Inventory actual wheel bytes
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          uv run --no-sync python .careops-ci-tools/portfolio-scripts/artifact_sbom.py --artifact dist/careops_process-0.1.0-py3-none-any.whl --name careops-process-wheel --source-commit "$SOURCE_COMMIT" --created-epoch "$(git show -s --format=%ct "$SOURCE_COMMIT")" --output dist/careops-process.spdx.json
      - name: Retain exact package digests in the run summary
        shell: bash
        run: |
          uv run --no-sync python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          files = sorted(p for p in Path('dist').iterdir() if p.is_file())
          assert files and Path('dist/careops_process-0.1.0-py3-none-any.whl').is_file()
          receipt = {'sourceCommit': os.environ['GITHUB_SHA'], 'files': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, 'artifactUploadExecuted': False}
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('\nPackage built and inventoried; main candidates are retained privately.\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          PYCODE
      - name: Retain private main candidate without Actions artifact storage
        id: private_candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = edithatogo/careops
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          tag="careops-process-candidate-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" dist/careops_process-0.1.0-py3-none-any.whl dist/careops-process.spdx.json dist/resolved-dependencies.cdx.json --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "careops-process private source candidate" --notes 'Private source candidate. Verification pending; no native deployment or operational acceptance.'
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
  attest-package:
    name: Attest main source package
    needs:
      - deliver-main
    if: github.event_name == 'workflow_dispatch' && inputs.native-attestation == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Main-only private candidate and qualification evidence assets.
      id-token: write # Explicit main-only formal attestation qualification.
      attestations: write # Formal release gate; current private-user capability is unavailable.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Download the exact private candidate built by this run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.deliver-main.outputs.candidate-tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = edithatogo/careops
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
      - name: Select the qualified verification runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.15.1
        id: python_runtime
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: 3.15.1
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - name: Independently compare downloaded package with its inventory
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, zipfile
          from pathlib import Path
          package = Path('candidate/careops_process-0.1.0-py3-none-any.whl')
          document = json.loads(Path('candidate/careops-process.spdx.json').read_text())
          assert document['packages'][0]['sourceInfo'] == 'Source commit: ' + os.environ['SOURCE_COMMIT']
          assert next(c['checksumValue'] for c in document['packages'][0]['checksums'] if c['algorithm'] == 'SHA256') == hashlib.sha256(package.read_bytes()).hexdigest()
          with zipfile.ZipFile(package) as archive:
              entries = [entry for entry in archive.infolist() if not entry.is_dir()]
              assert len({entry.filename for entry in entries}) == len(entries)
              actual = {entry.filename: hashlib.sha256(archive.read(entry)).hexdigest() for entry in entries}
          declared = {entry['fileName'].removeprefix('./'): next(c['checksumValue'] for c in entry['checksums'] if c['algorithm'] == 'SHA256') for entry in document['files']}
          assert actual and len(declared) == len(document['files']) and actual == declared
          print('Exact downloaded archive and all file digests match the inventory.')
          PYCODE
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: modules/careops-process/candidate/careops_process-0.1.0-py3-none-any.whl
          create-storage-record: false
      - name: Attest exact artifact inventory
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: modules/careops-process/candidate/careops_process-0.1.0-py3-none-any.whl
          sbom-path: modules/careops-process/candidate/careops-process.spdx.json
          create-storage-record: false
      - name: Verify exact source and workflow signatures
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" candidate/build-attestation.jsonl
          cp "$SBOM_BUNDLE" candidate/sbom-attestation.jsonl
          gh attestation verify candidate/careops_process-0.1.0-py3-none-any.whl --bundle "$PROVENANCE_BUNDLE" --repo edithatogo/careops --signer-workflow edithatogo/careops/.github/workflows/process-package.yml --source-ref refs/heads/main --source-digest "$SOURCE_COMMIT" --signer-digest "$SOURCE_COMMIT" --deny-self-hosted-runners --format json > candidate/provenance-verification.json
          gh attestation verify candidate/careops_process-0.1.0-py3-none-any.whl --bundle "$SBOM_BUNDLE" --repo edithatogo/careops --signer-workflow edithatogo/careops/.github/workflows/process-package.yml --source-ref refs/heads/main --source-digest "$SOURCE_COMMIT" --signer-digest "$SOURCE_COMMIT" --deny-self-hosted-runners --predicate-type https://spdx.dev/Document/v2.3 --format json > candidate/sbom-verification.json
      - name: Retain signature evidence beside the private package
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.deliver-main.outputs.candidate-tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = edithatogo/careops
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          mkdir -p retained-signatures
          for file in candidate/build-attestation.jsonl candidate/sbom-attestation.jsonl candidate/provenance-verification.json candidate/sbom-verification.json; do
            if [ -f "$file" ]; then cp "$file" "retained-signatures/attempt-$GITHUB_RUN_ATTEMPT-$(basename "$file")"; fi
          done
          if compgen -G 'retained-signatures/*' > /dev/null; then
            gh release upload "$CANDIDATE_TAG" retained-signatures/* --repo "$GITHUB_REPOSITORY"
          fi
  deliver-main:
    name: Build main package and retain private candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.5
          python-version: 3.15.1
          enable-cache: false
      - name: Install only the locked runtime and exact build backend
        run: |
          uv lock --check
          uv sync --frozen --no-install-project --no-dev --group build
      - name: Build the actual wheel once without network build isolation
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$SOURCE_COMMIT")
          export SOURCE_DATE_EPOCH
          uv build --python .venv/bin/python --wheel --no-build-isolation --out-dir dist
          uv export --frozen --no-dev --no-group build --all-extras --no-emit-project --format cyclonedx1.5 --output-file dist/resolved-dependencies.cdx.json > /dev/null
      - name: Exercise the installed wheel independently of source imports
        run: |
          uv venv --python 3.15.1 "$RUNNER_TEMP/wheel-smoke"
          uv export --frozen --no-dev --no-group build --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/wheel-runtime.lock" > /dev/null
          uv pip sync --python "$RUNNER_TEMP/wheel-smoke/bin/python" --require-hashes "$RUNNER_TEMP/wheel-runtime.lock"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" - <<'PYCODE'
          import os, secrets
          from pathlib import Path
          import careops_process
          assert 'site-packages' in Path(careops_process.__file__).parts
          os.environ['CAREOPS_PSEUDONYM_SECRET'] = secrets.token_hex(32)
          from careops_process.cli import main
          assert main(['--log-id', 'fictional-wheel-qualification']) == 0
          PYCODE
      - name: Read immutable qualified artifact tooling
        shell: bash
        run: |
          set -euo pipefail
          # Exact source edithatogo/careops@30df4953ea87c8915b4a525fc671a4c9857c3f7f; inherited licence retained.
          test ! -e "$GITHUB_WORKSPACE/modules/careops-process/.careops-ci-tools"
          cd "$GITHUB_WORKSPACE/modules/careops-process/.careops-security/upstream/30df4953ea87c8915b4a525fc671a4c9857c3f7f"
          sha256sum --check SHA256SUMS
          mkdir -p "$GITHUB_WORKSPACE/modules/careops-process/.careops-ci-tools"
          cp -R . "$GITHUB_WORKSPACE/modules/careops-process/.careops-ci-tools/"
      - name: Inventory actual wheel bytes
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          uv run --no-sync python .careops-ci-tools/portfolio-scripts/artifact_sbom.py --artifact dist/careops_process-0.1.0-py3-none-any.whl --name careops-process-wheel --source-commit "$SOURCE_COMMIT" --created-epoch "$(git show -s --format=%ct "$SOURCE_COMMIT")" --output dist/careops-process.spdx.json
      - name: Retain exact package digests in the run summary
        shell: bash
        run: |
          uv run --no-sync python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          files = sorted(p for p in Path('dist').iterdir() if p.is_file())
          assert files and Path('dist/careops_process-0.1.0-py3-none-any.whl').is_file()
          receipt = {'sourceCommit': os.environ['GITHUB_SHA'], 'files': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, 'artifactUploadExecuted': False}
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('\nPackage built and inventoried; main candidates are retained privately.\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          PYCODE
      - name: Retain private main candidate without Actions artifact storage
        id: private_candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = edithatogo/careops
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          tag="careops-process-candidate-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" dist/careops_process-0.1.0-py3-none-any.whl dist/careops-process.spdx.json dist/resolved-dependencies.cdx.json --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "careops-process private source candidate" --notes 'Private source candidate. Verification pending; no native deployment or operational acceptance.'
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
    permissions:
      contents: write # Main-only private candidate and qualification evidence assets.
    outputs:
      candidate-tag: ${{ steps.private_candidate.outputs.tag }}
  verify-main-candidate:
    name: Verify private main candidate bytes
    needs:
      - deliver-main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Main-only private candidate and qualification evidence assets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Download the exact private candidate built by this run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.deliver-main.outputs.candidate-tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = edithatogo/careops
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
      - name: Select the qualified verification runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.15.1
        id: python_runtime
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: 3.15.1
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - name: Independently compare downloaded package with its inventory
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, zipfile
          from pathlib import Path
          package = Path('candidate/careops_process-0.1.0-py3-none-any.whl')
          document = json.loads(Path('candidate/careops-process.spdx.json').read_text())
          assert document['packages'][0]['sourceInfo'] == 'Source commit: ' + os.environ['SOURCE_COMMIT']
          assert next(c['checksumValue'] for c in document['packages'][0]['checksums'] if c['algorithm'] == 'SHA256') == hashlib.sha256(package.read_bytes()).hexdigest()
          with zipfile.ZipFile(package) as archive:
              entries = [entry for entry in archive.infolist() if not entry.is_dir()]
              assert len({entry.filename for entry in entries}) == len(entries)
              actual = {entry.filename: hashlib.sha256(archive.read(entry)).hexdigest() for entry in entries}
          declared = {entry['fileName'].removeprefix('./'): next(c['checksumValue'] for c in entry['checksums'] if c['algorithm'] == 'SHA256') for entry in document['files']}
          assert actual and len(declared) == len(document['files']) and actual == declared
          print('Exact downloaded archive and all file digests match the inventory.')
          PYCODE
      - name: Verify native asset digests and retain explicit qualification limits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.deliver-main.outputs.candidate-tag }}
        run: |
          set -euo pipefail
          gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json apiUrl,isDraft,targetCommitish,assets > candidate/native-release-record.json
          python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          metadata = json.loads(Path('candidate/native-release-record.json').read_text())
          assert os.environ['GITHUB_REPOSITORY'] == 'edithatogo/careops'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert metadata['isDraft'] and metadata['targetCommitish'] == os.environ['GITHUB_SHA']
          assert metadata['apiUrl'].startswith('https://api.github.com/repos/edithatogo/careops/releases/')
          files = {}
          for name in ('careops_process-0.1.0-py3-none-any.whl', 'careops-process.spdx.json'):
              digest = hashlib.sha256((Path('candidate') / name).read_bytes()).hexdigest()
              asset = next((item for item in metadata['assets'] if item['name'] == name), None)
              if asset is None:
                  raise ValueError('Declared candidate asset is missing')
              assert asset['digest'] == 'sha256:' + digest
              files[name] = {'sha256': digest, 'assetId': asset['id']}
          receipt = {'schemaVersion': 1, 'phase': 'source-candidate-byte-verification',
              'repository': os.environ['GITHUB_REPOSITORY'], 'sourceCommit': os.environ['GITHUB_SHA'],
              'sourceRef': os.environ['GITHUB_REF'], 'runId': os.environ['GITHUB_RUN_ID'],
              'candidateTag': os.environ['CANDIDATE_TAG'], 'assets': files,
              'allArchiveFileHashesVerified': True, 'nativeAttestationExecuted': False,
              'signedReleaseQualified': False, 'nativeDeploymentQualified': False,
              'limit': 'Byte/source records only; formal signed-release qualification remains a separate required gate.'}
          Path('candidate/candidate-byte-verification.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('Native asset, source and archive inventories verified; signed release is not qualified by this job.')
          PYCODE
          mkdir -p retained-byte-evidence
          cp candidate/candidate-byte-verification.json "retained-byte-evidence/attempt-$GITHUB_RUN_ATTEMPT-candidate-byte-verification.json"
          cp candidate/native-release-record.json "retained-byte-evidence/attempt-$GITHUB_RUN_ATTEMPT-native-release-record.json"
          gh release upload "$CANDIDATE_TAG" retained-byte-evidence/* --repo "$GITHUB_REPOSITORY"
