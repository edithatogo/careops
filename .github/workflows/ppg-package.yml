name: PPG standalone package
on:
  pull_request:
    paths: ['modules/careops-ppg/**', '.github/workflows/ppg-package.yml']
  push:
    branches: [main]
    paths: ['modules/careops-ppg/**', '.github/workflows/ppg-package.yml']
  workflow_dispatch:
    inputs:
      native-attestation:
        description: Request formal signed-release qualification after native attestation capability is available; unavailable for user-owned private
          repos on 2026-11-06.
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ppg-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    defaults:
      run:
        working-directory: modules/careops-ppg
    name: Build and exercise the actual portable toolkit package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      id: python_runtime
      with:
        python-version: 3.15.1
    - name: Select verified repository-local Python
      env:
        SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
        EXPECTED_PYTHON: 3.15.1
      run: |
        if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
          echo 'Refusing a pre-existing helper environment.' >&2
          exit 1
        fi
        "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
        "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
        import os, pathlib, platform, sys
        expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
        if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
            raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
        print(sys.version)
        print('Verified repository-local helper environment.')
        PYCODE
        echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26.12.1
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: modules/careops-ppg/tools/native-document-template/global.json
    - name: Select repo-local Python and restore locked document tooling
      run: |
        python -m venv .venv
        .venv/bin/python -VV
        .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
        (cd tools/native-document-template && dotnet restore --locked-mode)
    - name: Package committed source and the existing assembler once
      run: .venv/bin/python scripts/build_release_candidate.py --output .local/release-candidate
    - name: Exercise the unpacked package independently of source imports
      run: |
        mkdir -p "$RUNNER_TEMP/ppg-consumer"
        unzip -q .local/release-candidate/careops-ppg-portable.zip -d "$RUNNER_TEMP/ppg-consumer"
        cd "$RUNNER_TEMP/ppg-consumer" || exit 1
        python -m venv .venv
        .venv/bin/python -VV
        .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
        (cd tools/native-document-template && dotnet restore --locked-mode)
        .venv/bin/python scripts/run_portable_tests.py
        .venv/bin/python scripts/build_submission_assembler.py --output rebuilt.html
        cmp PPG-submission-assembler.html rebuilt.html
    - name: Exercise optional catalogue from the packaged hash lock
      run: |
        cd "$RUNNER_TEMP/ppg-consumer" || exit 1
        .venv/bin/python -m pip install --require-hashes -r requirements-external-catalogue.lock
        .venv/bin/python scripts/run_portable_tests.py --python-only tests.test_external_catalogue tests.test_external_reconciliation tests.test_external_source_urls tests.test_registry_only
        node --test tests/test_external_catalogue.mjs
    - name: Read immutable qualified inventory tooling
      shell: bash
      run: |
        set -euo pipefail
        # Exact source edithatogo/careops@30df4953ea87c8915b4a525fc671a4c9857c3f7f; inherited licence retained.
        test ! -e "$GITHUB_WORKSPACE/modules/careops-ppg/.local/ci-release-policy"
        cd "$GITHUB_WORKSPACE/modules/careops-ppg/.careops-security/upstream/30df4953ea87c8915b4a525fc671a4c9857c3f7f"
        sha256sum --check SHA256SUMS
        mkdir -p "$GITHUB_WORKSPACE/modules/careops-ppg/.local/ci-release-policy"
        cp -R . "$GITHUB_WORKSPACE/modules/careops-ppg/.local/ci-release-policy/"
    - name: Inventory exact package bytes
      env:
        SOURCE_COMMIT: ${{ github.sha }}
      run: |
        .venv/bin/python .local/ci-release-policy/portfolio-scripts/artifact_sbom.py --artifact .local/release-candidate/careops-ppg-portable.zip --name careops-ppg-portable --source-commit "$SOURCE_COMMIT" --created-epoch "$(git show -s --format=%ct "$SOURCE_COMMIT")" --output .local/release-candidate/careops-ppg.spdx.json
        .venv/bin/python - <<'PYCODE'
        import json
        from pathlib import Path
        path = Path('.local/release-candidate/careops-ppg.spdx.json')
        document = json.loads(path.read_text())
        assert len(document['packages']) == 1
        package = document['packages'][0]
        assert package['licenseDeclared'] == 'NOASSERTION'
        package['licenseDeclared'] = 'Apache-2.0'
        package['licenseComments'] = 'Project-owned code only; third-party terms and external-content exclusions remain in NOTICE.md.'
        assert all(file['licenseConcluded'] == 'NOASSERTION' for file in document['files'])
        path.write_text(json.dumps(document, indent=2) + '\n')
        PYCODE
    - name: Retain exact package digests in the run summary
      shell: bash
      run: |
        .venv/bin/python - <<'PYCODE'
        import hashlib, json, os
        from pathlib import Path
        files = sorted(p for p in Path('.local/release-candidate').iterdir() if p.is_file())
        assert files and Path('.local/release-candidate/careops-ppg-portable.zip').is_file()
        receipt = {'sourceCommit': os.environ['GITHUB_SHA'], 'files': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, 'artifactUploadExecuted': False, 'nativeAttestationExecuted': False, 'signedReleaseQualified': False}
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
            output.write('\nPackage built and inventoried; main candidates are retained privately.\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
        PYCODE
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
  attest-package:
    name: Attest main source package
    needs:
    - deliver-main
    - verify-main-candidate
    if: github.event_name == 'workflow_dispatch' && inputs.native-attestation == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Explicit main-only qualification evidence beside the private draft candidate.
      id-token: write # Formal signer identity only for the requested main qualification.
      attestations: write # Preserve the formal signed-release gate; source verification cannot satisfy it.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        submodules: false
    - name: Download the exact private candidate built by this run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_TAG: ${{ needs.deliver-main.outputs.candidate-tag }}
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = edithatogo/careops
        test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
        test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
        test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
        gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
    - name: Select the qualified verification runtime
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      id: python_runtime
      with:
        python-version: 3.15.1
    - name: Select verified repository-local Python
      env:
        SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
        EXPECTED_PYTHON: 3.15.1
      run: |
        if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
          echo 'Refusing a pre-existing helper environment.' >&2
          exit 1
        fi
        "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
        "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
        import os, pathlib, platform, sys
        expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
        if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
            raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
        print(sys.version)
        print('Verified repository-local helper environment.')
        PYCODE
        echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
    - name: Independently compare downloaded package with its inventory
      env:
        SOURCE_COMMIT: ${{ github.sha }}
      run: |
        python -m venv .venv
        .venv/bin/python -VV
        .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
        .venv/bin/python - <<'PYCODE'
        import hashlib, json, os, zipfile
        from pathlib import Path
        package = Path('candidate/careops-ppg-portable.zip')
        document = json.loads(Path('candidate/careops-ppg.spdx.json').read_text())
        assert document['packages'][0]['sourceInfo'] == 'Source commit: ' + os.environ['SOURCE_COMMIT']
        assert document['packages'][0]['licenseDeclared'] == 'Apache-2.0'
        assert document['packages'][0]['checksums'][0]['checksumValue'] == hashlib.sha256(package.read_bytes()).hexdigest()
        with zipfile.ZipFile(package) as archive:
            entries = [entry for entry in archive.infolist() if not entry.is_dir()]
            assert len({entry.filename for entry in entries}) == len(entries)
            actual = {entry.filename: hashlib.sha256(archive.read(entry)).hexdigest() for entry in entries}
        declared = {entry['fileName'].removeprefix('./'): next(c['checksumValue'] for c in entry['checksums'] if c['algorithm'] == 'SHA256') for entry in document['files']}
        assert actual and len(declared) == len(document['files']) and actual == declared
        print('Exact downloaded archive and all file digests match the inventory.')
        PYCODE
    - name: Attest build provenance
      id: provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-path: candidate/careops-ppg-portable.zip
        create-storage-record: false
    - name: Attest exact artifact inventory
      id: sbom
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-path: candidate/careops-ppg-portable.zip
        sbom-path: candidate/careops-ppg.spdx.json
        create-storage-record: false
    - name: Verify exact source and workflow signatures
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_COMMIT: ${{ github.sha }}
        PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
      run: |
        cp "$PROVENANCE_BUNDLE" candidate/build-attestation.jsonl
        cp "$SBOM_BUNDLE" candidate/sbom-attestation.jsonl
        gh attestation verify candidate/careops-ppg-portable.zip --bundle "$PROVENANCE_BUNDLE" --repo edithatogo/careops --signer-workflow edithatogo/careops/.github/workflows/ppg-package.yml --source-ref refs/heads/main --source-digest "$SOURCE_COMMIT" --signer-digest "$SOURCE_COMMIT" --deny-self-hosted-runners --format json > candidate/provenance-verification.json
        gh attestation verify candidate/careops-ppg-portable.zip --bundle "$SBOM_BUNDLE" --repo edithatogo/careops --signer-workflow edithatogo/careops/.github/workflows/ppg-package.yml --source-ref refs/heads/main --source-digest "$SOURCE_COMMIT" --signer-digest "$SOURCE_COMMIT" --deny-self-hosted-runners --predicate-type https://spdx.dev/Document/v2.3 --format json > candidate/sbom-verification.json
    - name: Retain signature evidence beside the private package
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_TAG: ${{ needs.deliver-main.outputs.candidate-tag }}
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = edithatogo/careops
        test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
        mkdir -p retained-signatures
          for file in candidate/build-attestation.jsonl candidate/sbom-attestation.jsonl candidate/provenance-verification.json candidate/sbom-verification.json; do
          if [ -f "$file" ]; then cp "$file" "retained-signatures/attempt-$GITHUB_RUN_ATTEMPT-$(basename "$file")"; fi
        done
        if compgen -G 'retained-signatures/*' > /dev/null; then
          gh release upload "$CANDIDATE_TAG" retained-signatures/* --repo "$GITHUB_REPOSITORY"
        fi
  deliver-main:
    defaults:
      run:
        working-directory: modules/careops-ppg
    name: Build main PPG package and retain private candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      id: python_runtime
      with:
        python-version: 3.15.1
    - name: Select verified repository-local Python
      env:
        SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
        EXPECTED_PYTHON: 3.15.1
      run: |
        if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
          echo 'Refusing a pre-existing helper environment.' >&2
          exit 1
        fi
        "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
        "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
        import os, pathlib, platform, sys
        expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
        if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
            raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
        print(sys.version)
        print('Verified repository-local helper environment.')
        PYCODE
        echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26.12.1
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: modules/careops-ppg/tools/native-document-template/global.json
    - name: Select repo-local Python and restore locked document tooling
      run: |
        python -m venv .venv
        .venv/bin/python -VV
        .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
        (cd tools/native-document-template && dotnet restore --locked-mode)
    - name: Package committed source and the existing assembler once
      run: .venv/bin/python scripts/build_release_candidate.py --output .local/release-candidate
    - name: Exercise the unpacked package independently of source imports
      run: |
        mkdir -p "$RUNNER_TEMP/ppg-consumer"
        unzip -q .local/release-candidate/careops-ppg-portable.zip -d "$RUNNER_TEMP/ppg-consumer"
        cd "$RUNNER_TEMP/ppg-consumer" || exit 1
        python -m venv .venv
        .venv/bin/python -VV
        .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
        (cd tools/native-document-template && dotnet restore --locked-mode)
        .venv/bin/python scripts/run_portable_tests.py
        .venv/bin/python scripts/build_submission_assembler.py --output rebuilt.html
        cmp PPG-submission-assembler.html rebuilt.html
    - name: Exercise optional catalogue from the packaged hash lock
      run: |
        cd "$RUNNER_TEMP/ppg-consumer" || exit 1
        .venv/bin/python -m pip install --require-hashes -r requirements-external-catalogue.lock
        .venv/bin/python scripts/run_portable_tests.py --python-only tests.test_external_catalogue tests.test_external_reconciliation tests.test_external_source_urls tests.test_registry_only
        node --test tests/test_external_catalogue.mjs
    - name: Read immutable qualified inventory tooling
      shell: bash
      run: |
        set -euo pipefail
        # Exact source edithatogo/careops@30df4953ea87c8915b4a525fc671a4c9857c3f7f; inherited licence retained.
        test ! -e "$GITHUB_WORKSPACE/modules/careops-ppg/.local/ci-release-policy"
        cd "$GITHUB_WORKSPACE/modules/careops-ppg/.careops-security/upstream/30df4953ea87c8915b4a525fc671a4c9857c3f7f"
        sha256sum --check SHA256SUMS
        mkdir -p "$GITHUB_WORKSPACE/modules/careops-ppg/.local/ci-release-policy"
        cp -R . "$GITHUB_WORKSPACE/modules/careops-ppg/.local/ci-release-policy/"
    - name: Inventory exact package bytes
      env:
        SOURCE_COMMIT: ${{ github.sha }}
      run: |
        .venv/bin/python .local/ci-release-policy/portfolio-scripts/artifact_sbom.py --artifact .local/release-candidate/careops-ppg-portable.zip --name careops-ppg-portable --source-commit "$SOURCE_COMMIT" --created-epoch "$(git show -s --format=%ct "$SOURCE_COMMIT")" --output .local/release-candidate/careops-ppg.spdx.json
        .venv/bin/python - <<'PYCODE'
        import json
        from pathlib import Path
        path = Path('.local/release-candidate/careops-ppg.spdx.json')
        document = json.loads(path.read_text())
        assert len(document['packages']) == 1
        package = document['packages'][0]
        assert package['licenseDeclared'] == 'NOASSERTION'
        package['licenseDeclared'] = 'Apache-2.0'
        package['licenseComments'] = 'Project-owned code only; third-party terms and external-content exclusions remain in NOTICE.md.'
        assert all(file['licenseConcluded'] == 'NOASSERTION' for file in document['files'])
        path.write_text(json.dumps(document, indent=2) + '\n')
        PYCODE
    - name: Retain exact package digests in the run summary
      shell: bash
      run: |
        .venv/bin/python - <<'PYCODE'
        import hashlib, json, os
        from pathlib import Path
        files = sorted(p for p in Path('.local/release-candidate').iterdir() if p.is_file())
        assert files and Path('.local/release-candidate/careops-ppg-portable.zip').is_file()
        receipt = {'sourceCommit': os.environ['GITHUB_SHA'], 'files': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, 'artifactUploadExecuted': False, 'nativeAttestationExecuted': False, 'signedReleaseQualified': False}
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
            output.write('\nPackage built and inventoried; main candidates are retained privately.\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
        PYCODE
    - name: Retain private main candidate without Actions artifact storage
      id: private_candidate
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = edithatogo/careops
        test "$GITHUB_REF" = refs/heads/main
        test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
        tag="careops-ppg-candidate-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        gh release create "$tag" .local/release-candidate/careops-ppg-portable.zip .local/release-candidate/careops-ppg.spdx.json .local/release-candidate/package.json .local/release-candidate/PPG-submission-assembler.html --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "careops-ppg private source candidate" --notes 'Private source candidate. Verification pending; no native deployment or operational acceptance.'
        test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
        test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
        printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # Main-only private draft candidate publication; PR jobs remain read-only.
    outputs:
      candidate-tag: ${{ steps.private_candidate.outputs.tag }}
  verify-main-candidate:
    name: Verify private main PPG candidate bytes
    needs:
    - deliver-main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Main-only verification evidence beside the exact private draft candidate.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        submodules: false
    - name: Download the exact private candidate built by this run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_TAG: ${{ needs.deliver-main.outputs.candidate-tag }}
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = edithatogo/careops
        test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
        test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
        test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
        gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
    - name: Select the qualified verification runtime
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      id: python_runtime
      with:
        python-version: 3.15.1
    - name: Select verified repository-local Python
      env:
        SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
        EXPECTED_PYTHON: 3.15.1
      run: |
        if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
          echo 'Refusing a pre-existing helper environment.' >&2
          exit 1
        fi
        "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
        "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
        import os, pathlib, platform, sys
        expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
        if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
            raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
        print(sys.version)
        print('Verified repository-local helper environment.')
        PYCODE
        echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
    - name: Independently compare downloaded package with its inventory
      env:
        SOURCE_COMMIT: ${{ github.sha }}
      run: |
        python -m venv .venv
        .venv/bin/python -VV
        .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
        .venv/bin/python - <<'PYCODE'
        import hashlib, json, os, zipfile
        from pathlib import Path
        package = Path('candidate/careops-ppg-portable.zip')
        document = json.loads(Path('candidate/careops-ppg.spdx.json').read_text())
        assert document['packages'][0]['sourceInfo'] == 'Source commit: ' + os.environ['SOURCE_COMMIT']
        assert document['packages'][0]['licenseDeclared'] == 'Apache-2.0'
        assert document['packages'][0]['checksums'][0]['checksumValue'] == hashlib.sha256(package.read_bytes()).hexdigest()
        with zipfile.ZipFile(package) as archive:
            entries = [entry for entry in archive.infolist() if not entry.is_dir()]
            assert len({entry.filename for entry in entries}) == len(entries)
            actual = {entry.filename: hashlib.sha256(archive.read(entry)).hexdigest() for entry in entries}
        declared = {entry['fileName'].removeprefix('./'): next(c['checksumValue'] for c in entry['checksums'] if c['algorithm'] == 'SHA256') for entry in document['files']}
        assert actual and len(declared) == len(document['files']) and actual == declared
        print('Exact downloaded archive and all file digests match the inventory.')
        PYCODE
    - name: Verify native asset digests and retain explicit qualification limits
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_TAG: ${{ needs.deliver-main.outputs.candidate-tag }}
      run: |
        set -euo pipefail
        gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json apiUrl,isDraft,targetCommitish,assets > candidate/native-release-record.json
        python - <<'PYCODE'
        import hashlib, json, os
        from pathlib import Path
        metadata = json.loads(Path('candidate/native-release-record.json').read_text())
        assert os.environ['GITHUB_REPOSITORY'] == 'edithatogo/careops'
        assert os.environ['GITHUB_REF'] == 'refs/heads/main'
        assert metadata['isDraft'] and metadata['targetCommitish'] == os.environ['GITHUB_SHA']
        assert metadata['apiUrl'].startswith('https://api.github.com/repos/edithatogo/careops/releases/')
        import zipfile
        manifest = json.loads(Path('candidate/package.json').read_text())
        assert manifest['sourceCommit'] == os.environ['GITHUB_SHA']
        assert manifest['archiveSha256'] == hashlib.sha256(Path('candidate/careops-ppg-portable.zip').read_bytes()).hexdigest()
        assert manifest['assemblerSha256'] == hashlib.sha256(Path('candidate/PPG-submission-assembler.html').read_bytes()).hexdigest()
        assert manifest['nativeWrites'] is False
        with zipfile.ZipFile('candidate/careops-ppg-portable.zip') as archive:
            assert archive.read('PPG-submission-assembler.html') == Path('candidate/PPG-submission-assembler.html').read_bytes()
        assert len(metadata['assets']) == 4
        assert len({asset['name'] for asset in metadata['assets']}) == 4
        assert len({asset['id'] for asset in metadata['assets']}) == 4
        assert all(asset['id'] for asset in metadata['assets'])
        files = {}
        for name in ('careops-ppg-portable.zip', 'careops-ppg.spdx.json', 'package.json', 'PPG-submission-assembler.html'):
            digest = hashlib.sha256((Path('candidate') / name).read_bytes()).hexdigest()
            asset = next(item for item in metadata['assets'] if item['name'] == name)
            assert asset['digest'] == 'sha256:' + digest
            files[name] = {'sha256': digest, 'assetId': asset['id']}
        receipt = {'schemaVersion': 1, 'phase': 'source-candidate-byte-verification',
            'repository': os.environ['GITHUB_REPOSITORY'], 'sourceCommit': os.environ['GITHUB_SHA'],
            'sourceRef': os.environ['GITHUB_REF'], 'runId': os.environ['GITHUB_RUN_ID'],
            'candidateTag': os.environ['CANDIDATE_TAG'], 'assets': files,
            'allArchiveFileHashesVerified': True, 'nativeAttestationExecuted': False,
            'signedReleaseQualified': False, 'nativeDeploymentQualified': False,
            'limit': 'Byte/source records only; formal signed-release qualification remains a separate required gate.'}
        Path('candidate/candidate-byte-verification.json').write_text(json.dumps(receipt, indent=2) + '\n')
        print('Native asset, source and archive inventories verified; signed release is not qualified by this job.')
        PYCODE
        mkdir -p retained-byte-evidence
        cp candidate/candidate-byte-verification.json "retained-byte-evidence/attempt-$GITHUB_RUN_ATTEMPT-candidate-byte-verification.json"
        cp candidate/native-release-record.json "retained-byte-evidence/attempt-$GITHUB_RUN_ATTEMPT-native-release-record.json"
        gh release upload "$CANDIDATE_TAG" retained-byte-evidence/* --repo "$GITHUB_REPOSITORY"
  atlas-python315:
    name: Atlas pinned-source integration (Python 3.15.1)
    defaults:
      run:
        working-directory: modules/careops-ppg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edithatogo/global-medicines-atlas
          ref: 21f7721a8971ca6c9e704924503eebdd75356dce
          path: modules/careops-ppg/.local/atlas-python315-pin
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: modules/careops-ppg/.node-version
      - name: Qualify the explicit Atlas Python 3.15 profile
        run: |
          python -m venv .venv-atlas
          .venv-atlas/bin/python -VV
          .venv-atlas/bin/python -c 'import pathlib,sys; assert sys.version_info[:3] == tuple(map(int,pathlib.Path(".python-version-atlas").read_text().strip().split("."))), sys.version'
          .venv-atlas/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-atlas.lock
          .venv-atlas/bin/python scripts/qualify_atlas_adapter.py --atlas-root .local/atlas-python315-pin --atlas-profile
