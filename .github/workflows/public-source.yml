name: Public source boundary
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Public source boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - run: python portfolio-scripts/validate_public_source.py
      - run: python -m unittest discover -s portfolio-scripts/checks -p test_public_source.py -v
      - run: python portfolio-scripts/qualify_incidents.py
      - run: python -m unittest discover -s portfolio-scripts/checks -p test_incidents_composition.py -v
