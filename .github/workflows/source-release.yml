name: Attested standalone source release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    uses: edithatogo/careops/.github/workflows/reusable-source-security.yml@30df4953ea87c8915b4a525fc671a4c9857c3f7f
    with:
      policy-revision: 30df4953ea87c8915b4a525fc671a4c9857c3f7f
  source:
    name: Qualify standalone module and release packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - run: python -m unittest discover -s portfolio-scripts/checks -p test_source_release.py -v
      - run: python portfolio-scripts/qualify_incidents.py
  package:
    name: Build once, attest and verify actual source artifact
    if: github.ref == 'refs/heads/main' && github.repository == 'edithatogo/careops'
    needs: [security, source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Federated GitHub artifact signing only; no tenant credential.
      attestations: write # Store build/SBOM attestations for this source artifact.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - name: Build only reviewed committed module files
        run: python portfolio-scripts/build_source_release.py --output .local/source-release
      - name: Validate the generated SPDX against the official pinned schema
        env:
          SPDX_SCHEMA_SHA256: 4126dc29f15e92feec92e9622f4939131ad58b125d6f578aa93e980a6e6f3212
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/spdx/spdx-spec/6f2cb47d13db19b12c23885573b22ef32ec1ada5/schemas/spdx-schema.json -o "$RUNNER_TEMP/spdx-schema.json"
          echo "$SPDX_SCHEMA_SHA256  $RUNNER_TEMP/spdx-schema.json" | sha256sum --check
          python -c 'import json, jsonschema, os; schema=json.load(open(os.environ["RUNNER_TEMP"]+"/spdx-schema.json")); jsonschema.Draft7Validator.check_schema(schema); jsonschema.validate(json.load(open(".local/source-release/careops-incidents.spdx.json")), schema)'
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .local/source-release/*.tar.gz
          create-storage-record: false
      - name: Attest matching SPDX SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .local/source-release/*.tar.gz
          sbom-path: .local/source-release/careops-incidents.spdx.json
          create-storage-record: false
      - name: Verify provenance and SBOM against this repository and workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" .local/source-release/build-attestation.jsonl
          cp "$SBOM_BUNDLE" .local/source-release/sbom-attestation.jsonl
          gh attestation verify .local/source-release/*.tar.gz --bundle "$PROVENANCE_BUNDLE" --repo edithatogo/careops --signer-workflow edithatogo/careops/.github/workflows/source-release.yml --source-ref refs/heads/main --source-digest "$EXPECTED_SOURCE_COMMIT" --signer-digest "$EXPECTED_SOURCE_COMMIT" --deny-self-hosted-runners --format json > .local/source-release/provenance-verification.json
          gh attestation verify .local/source-release/*.tar.gz --bundle "$SBOM_BUNDLE" --repo edithatogo/careops --signer-workflow edithatogo/careops/.github/workflows/source-release.yml --source-ref refs/heads/main --source-digest "$EXPECTED_SOURCE_COMMIT" --signer-digest "$EXPECTED_SOURCE_COMMIT" --deny-self-hosted-runners --predicate-type https://spdx.dev/Document/v2.3 --format json > .local/source-release/sbom-verification.json
      - name: Retain source candidate and any completed attestation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: careops-incidents-source-candidate-${{ github.sha }}
          path: .local/source-release/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
