name: Registration assurance source contract
on:
  pull_request:
    paths:
      - 'modules/careops-registration-assurance/**'
      - 'conductor/tracks/registration_assurance_20261113/**'
      - 'docs/credentialing/registration-assurance-integration-contract.md'
      - '.github/workflows/registration-assurance.yml'
  push:
    branches: [main]
    paths:
      - 'modules/careops-registration-assurance/**'
      - 'conductor/tracks/registration_assurance_20261113/**'
      - 'docs/credentialing/registration-assurance-integration-contract.md'
      - '.github/workflows/registration-assurance.yml'

permissions:
  contents: read

concurrency:
  group: registration-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic:
    name: Python 3.15.1 synthetic assurance contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python 3.15.1
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
            echo 'Refusing pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected selected repository-local Python 3.15 environment.')
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - name: Compile source and tests
        run: python -m compileall -q modules/careops-registration-assurance/src modules/careops-registration-assurance/tests
      - name: Run source-only deterministic and adversarial tests
        run: python -m unittest discover -s modules/careops-registration-assurance/tests -p 'test_*.py' -v
      - name: Check contract JSON is valid
        run: python -m json.tool conductor/tracks/registration_assurance_20261113/registration-observation.schema.json > /dev/null
