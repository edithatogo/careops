name: Credentialing end-to-end synthetic harness

on:
  pull_request:
    paths:
      - 'scripts/simulate_credentialing_renewal.py'
      - 'tests/test_credentialing_e2e.py'
      - 'tests/fixtures/credentialing-mvp/routine-renewal-complete.synthetic.json'
      - 'conductor/tracks/credentialing_release_20260910/e2e-harness.md'
      - '.github/workflows/credentialing-e2e-harness.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/simulate_credentialing_renewal.py'
      - 'tests/test_credentialing_e2e.py'
      - 'tests/fixtures/credentialing-mvp/routine-renewal-complete.synthetic.json'
      - 'conductor/tracks/credentialing_release_20260910/e2e-harness.md'
      - '.github/workflows/credentialing-e2e-harness.yml'

permissions:
  contents: read

concurrency:
  group: credentialing-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    name: Python 3.14 synthetic state sequence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Compile the simulator and tests
        run: >-
          python -m compileall -q
          scripts/simulate_credentialing_renewal.py
          tests/test_credentialing_e2e.py
      - name: Run fail-closed unit tests
        run: python -m unittest -v tests/test_credentialing_e2e.py
      - name: Generate a deterministic review receipt
        run: >-
          python scripts/simulate_credentialing_renewal.py
          tests/fixtures/credentialing-mvp/routine-renewal-complete.synthetic.json
          --output /tmp/credentialing-e2e-receipt.json
      - name: Confirm the MVP stops before activation
        run: |
          grep -q '"terminal_state": "decision-recorded-not-activated"' /tmp/credentialing-e2e-receipt.json
          grep -q '"production_writes": false' /tmp/credentialing-e2e-receipt.json
          grep -q '"release_to_practise": false' /tmp/credentialing-e2e-receipt.json
      - name: Retain the synthetic receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: credentialing-e2e-synthetic-receipt
          path: /tmp/credentialing-e2e-receipt.json
          retention-days: 14
          if-no-files-found: error
