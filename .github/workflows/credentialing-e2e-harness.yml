name: Credentialing end-to-end synthetic harness

on:
  pull_request:
    paths:
      - 'scripts/simulate_credentialing_renewal.py'
      - 'tests/test_credentialing_e2e.py'
      - 'tests/fixtures/credentialing-mvp/routine-renewal-complete.synthetic.json'
      - 'conductor/tracks/credentialing_release_20260910/e2e-harness.md'
      - '.github/workflows/credentialing-e2e-harness.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/simulate_credentialing_renewal.py'
      - 'tests/test_credentialing_e2e.py'
      - 'tests/fixtures/credentialing-mvp/routine-renewal-complete.synthetic.json'
      - 'conductor/tracks/credentialing_release_20260910/e2e-harness.md'
      - '.github/workflows/credentialing-e2e-harness.yml'

permissions:
  contents: read

concurrency:
  group: credentialing-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    name: Python 3.15.1 synthetic state sequence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.15.1
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          "$SELECTED_PYTHON" -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - name: Compile the simulator and tests
        run: >-
          python -m compileall -q
          scripts/simulate_credentialing_renewal.py
          tests/test_credentialing_e2e.py
      - name: Run fail-closed unit tests
        run: python -m unittest -v tests/test_credentialing_e2e.py
      - name: Generate a deterministic review receipt
        run: >-
          python scripts/simulate_credentialing_renewal.py
          tests/fixtures/credentialing-mvp/routine-renewal-complete.synthetic.json
          --output /tmp/credentialing-e2e-receipt.json
      - name: Confirm the MVP stops before activation
        run: |
          grep -q '"terminal_state": "decision-recorded-not-activated"' /tmp/credentialing-e2e-receipt.json
          grep -q '"production_writes": false' /tmp/credentialing-e2e-receipt.json
          grep -q '"release_to_practise": false' /tmp/credentialing-e2e-receipt.json
      - name: Retain the synthetic receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: credentialing-e2e-synthetic-receipt
          path: /tmp/credentialing-e2e-receipt.json
          retention-days: 14
          if-no-files-found: error
