name: No-admin pilot profile safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pilot:
    name: Pilot preflight (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned test-only tools
        run: python -m pip install coverage==7.15.4 mypy==2.3.0 ruff==0.16.2
      - name: Strict static checks
        run: |
          python -m ruff check --config tests/pilot_profiles/pyproject.toml scripts/pilot_profiles.py tests/pilot_profiles
          python -m mypy --config-file tests/pilot_profiles/pyproject.toml scripts/pilot_profiles.py tests/pilot_profiles
      - name: Negative tests and complete branch coverage
        run: |
          python -m coverage run --branch --source=scripts.pilot_profiles -m unittest discover -s tests/pilot_profiles -v
          python -m coverage report --show-missing --fail-under=100
