name: Security and fuzzing
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: edithatogo/careops/.github/workflows/reusable-source-security.yml@1373e971013724dfaa268e215a45505bb89300cd
    with:
      policy-revision: 1373e971013724dfaa268e215a45505bb89300cd
  fuzz:
    name: Configuration fuzzing and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
      - run: python portfolio-scripts/ci_delivery.py verify-lock
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Bounded generative fuzz tests with shrinking and reproducible failures
        run: python -m unittest discover -s portfolio-scripts/fuzz -v
      - name: All parent source-boundary regressions
        run: python -m unittest discover -s portfolio-scripts/checks -v
      - name: Audit exact Python CI dependencies
        run: python -m pip_audit --disable-pip --no-deps -r requirements-ci.lock
  codeql:
    name: CodeQL Python and Actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # Upload CodeQL results to this repository only.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4 resolved 2026-10-18
        with:
          languages: python,actions
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4 resolved 2026-10-18
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
  gate:
    name: Security gate
    if: always()
    needs: [security, fuzz, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all security jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success'
