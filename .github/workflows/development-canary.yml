name: Development dependency canary
on:
  schedule:
    - cron: '23 18 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/development-canary.yml
      - portfolio-scripts/checks/test_canary_finalizer.py
      - portfolio-scripts/ci_delivery.py
permissions:
  contents: read
concurrency:
  group: development-canary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    name: Preview tool qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Resolve exact preview candidates without changing the working lock
        run: python portfolio-scripts/ci_delivery.py lock --preview --output .local/canary/requirements.lock --receipt .local/canary/candidate.json
      - name: Install only the resolved hash-locked candidate
        run: python -m pip install --require-hashes -r .local/canary/requirements.lock
      - name: Qualify affected tools and source behaviour
        run: |
          python -m unittest discover -s portfolio-scripts/checks -v
          python -m unittest discover -s portfolio-scripts/fuzz -v
          ruff check --config tests/native_roadmap/pyproject.toml scripts/validate_native_roadmap.py tests/native_roadmap
          ruff check --config tests/pilot_profiles/pyproject.toml scripts/pilot_profiles.py tests/pilot_profiles
          mypy --config-file tests/native_roadmap/pyproject.toml scripts/validate_native_roadmap.py tests/native_roadmap
          mypy --config-file tests/pilot_profiles/pyproject.toml scripts/pilot_profiles.py tests/pilot_profiles
          pip-audit --disable-pip --no-deps -r .local/canary/requirements.lock
          zizmor --offline --persona pedantic --format plain .github/workflows
      - name: Keep exact candidate evidence even after a qualification failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-candidate
          path: .local/canary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  runtime:
    name: Runtime preview discovery and compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Select verified repository-local Python
        id: helper
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - name: Discover a runnable preview newer than the qualified baseline
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/runtime-canary
          runtime_manifest_revision="$(gh api repos/actions/python-versions/commits/main --jq .sha)"
          [[ "$runtime_manifest_revision" =~ ^[a-f0-9]{40}$ ]]
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/actions/python-versions/$runtime_manifest_revision/versions-manifest.json" -o .local/runtime-canary/manifest.json
          runtime_platform="$(python -c 'import platform; print(platform.freedesktop_os_release()["VERSION_ID"])')"
          python portfolio-scripts/ci_delivery.py runtime --platform-version "$runtime_platform" --manifest .local/runtime-canary/manifest.json --manifest-revision "$runtime_manifest_revision" --output .local/runtime-canary/discovery.json --github-output "$GITHUB_OUTPUT"
      - name: Set up the exact available preview only
        if: steps.discover.outputs.available == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_preview_runtime
        with:
          python-version: ${{ steps.discover.outputs.version }}
          allow-prereleases: true
      - name: Select verified repository-local Python
        if: steps.discover.outputs.available == 'true'
        env:
          SELECTED_PYTHON: ${{ steps.python_preview_runtime.outputs.python-path }}
          EXPECTED_PYTHON: ${{ steps.discover.outputs.version }}
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-preview" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-preview" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-preview"
          "$GITHUB_WORKSPACE/.venv-careops-preview/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-preview'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-preview/bin" >> "$GITHUB_PATH"
      - name: Record the resolved runtime and install current qualified tools
        if: steps.discover.outputs.available == 'true'
        run: |
          mkdir -p .local/runtime-canary
          python -VV > .local/runtime-canary/python-version.txt
          python -m pip install --require-hashes -r requirements-ci.lock
      - name: Test current source against development CPython
        id: runtime_tests
        if: steps.discover.outputs.available == 'true'
        run: |
          python -m unittest discover -s portfolio-scripts/checks -v
          python -m unittest discover -s portfolio-scripts/fuzz -v
          python portfolio-scripts/qualify_incidents.py
      - name: Record the actual runtime qualification outcome
        if: always()
        env:
          HELPER_OUTCOME: ${{ steps.helper.outcome }}
          DISCOVERY_OUTCOME: ${{ steps.discover.outcome }}
          RUNTIME_TEST_OUTCOME: ${{ steps.runtime_tests.outcome }}
        run: |
          if [ "$HELPER_OUTCOME" != success ] || [ ! -x "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" ]; then
            mkdir -p .local/runtime-canary
            printf '%s\n' '{"state":"setup-blocked","promoted":false,"runtimeTestsExecuted":false,"reason":"verified-helper-unavailable"}' > .local/runtime-canary/helper-failure.json
            exit 1
          fi
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I portfolio-scripts/ci_delivery.py runtime-finalize --receipt .local/runtime-canary/discovery.json --outcome "$RUNTIME_TEST_OUTCOME" --discovery-outcome "$DISCOVERY_OUTCOME"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-candidate
          path: .local/runtime-canary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
