name: Development dependency canary
on:
  schedule:
    - cron: '23 18 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-canary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    name: Preview tool qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - name: Resolve exact preview candidates without changing the working lock
        run: python portfolio-scripts/ci_delivery.py lock --preview --output .local/canary/requirements.lock --receipt .local/canary/candidate.json
      - name: Install only the resolved hash-locked candidate
        run: python -m pip install --require-hashes -r .local/canary/requirements.lock
      - name: Qualify affected tools and source behaviour
        run: |
          python -m unittest discover -s portfolio-scripts/checks -v
          python -m unittest discover -s portfolio-scripts/fuzz -v
          ruff check --config tests/native_roadmap/pyproject.toml scripts/validate_native_roadmap.py tests/native_roadmap
          ruff check --config tests/pilot_profiles/pyproject.toml scripts/pilot_profiles.py tests/pilot_profiles
          mypy --config-file tests/native_roadmap/pyproject.toml scripts/validate_native_roadmap.py tests/native_roadmap
          mypy --config-file tests/pilot_profiles/pyproject.toml scripts/pilot_profiles.py tests/pilot_profiles
          pip-audit --disable-pip --no-deps -r .local/canary/requirements.lock
          zizmor --offline --persona pedantic --format plain .github/workflows
      - name: Keep exact candidate evidence even after a qualification failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-candidate
          path: .local/canary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  runtime:
    name: Runtime preview discovery and compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
      - name: Discover a runnable preview newer than the qualified baseline
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/runtime-canary
          runtime_manifest_revision="$(gh api repos/actions/python-versions/commits/main --jq .sha)"
          [[ "$runtime_manifest_revision" =~ ^[a-f0-9]{40}$ ]]
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/actions/python-versions/$runtime_manifest_revision/versions-manifest.json" -o .local/runtime-canary/manifest.json
          runtime_platform="$(python -c 'import platform; print(platform.freedesktop_os_release()["VERSION_ID"])')"
          python portfolio-scripts/ci_delivery.py runtime --platform-version "$runtime_platform" --manifest .local/runtime-canary/manifest.json --manifest-revision "$runtime_manifest_revision" --output .local/runtime-canary/discovery.json --github-output "$GITHUB_OUTPUT"
      - name: Set up the exact available preview only
        if: steps.discover.outputs.available == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.discover.outputs.version }}
          allow-prereleases: true
      - name: Record the resolved runtime and install current qualified tools
        if: steps.discover.outputs.available == 'true'
        run: |
          mkdir -p .local/runtime-canary
          python -VV > .local/runtime-canary/python-version.txt
          python -m pip install --require-hashes -r requirements-ci.lock
      - name: Test current source against development CPython
        id: runtime_tests
        if: steps.discover.outputs.available == 'true'
        run: |
          python -m unittest discover -s portfolio-scripts/checks -v
          python -m unittest discover -s portfolio-scripts/fuzz -v
          python portfolio-scripts/qualify_incidents.py
      - name: Record the actual runtime qualification outcome
        if: always()
        env:
          DISCOVERY_OUTCOME: ${{ steps.discover.outcome }}
          RUNTIME_TEST_OUTCOME: ${{ steps.runtime_tests.outcome }}
        run: python portfolio-scripts/ci_delivery.py runtime-finalize --receipt .local/runtime-canary/discovery.json --outcome "$RUNTIME_TEST_OUTCOME" --discovery-outcome "$DISCOVERY_OUTCOME"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-candidate
          path: .local/runtime-canary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
