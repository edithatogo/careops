name: Development dependency canary
on:
  schedule:
    - cron: '23 18 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/development-canary.yml
      - portfolio-scripts/checks/test_canary_finalizer.py
      - portfolio-scripts/ci_delivery.py
permissions:
  contents: read
concurrency:
  group: development-canary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    name: Preview tool qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Resolve exact preview candidates without changing the working lock
        run: python portfolio-scripts/ci_delivery.py lock --preview --output .local/canary/requirements.lock --receipt .local/canary/candidate.json
      - name: Install only the resolved hash-locked candidate
        run: python -m pip install --require-hashes -r .local/canary/requirements.lock
      - name: Qualify affected tools and source behaviour
        run: |
          python -m unittest discover -s portfolio-scripts/checks -v
          python -m unittest discover -s portfolio-scripts/fuzz -v
          ruff check --config tests/native_roadmap/pyproject.toml scripts/validate_native_roadmap.py tests/native_roadmap
          ruff check --config tests/pilot_profiles/pyproject.toml scripts/pilot_profiles.py tests/pilot_profiles
          mypy --config-file tests/native_roadmap/pyproject.toml scripts/validate_native_roadmap.py tests/native_roadmap
          mypy --config-file tests/pilot_profiles/pyproject.toml scripts/pilot_profiles.py tests/pilot_profiles
          pip-audit --disable-pip --no-deps -r .local/canary/requirements.lock
          zizmor --offline --persona pedantic --format plain .github/workflows
      - name: Keep exact candidate evidence even after a qualification failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-candidate
          path: .local/canary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
