name: approve
'on':
  pull_request:
    paths:
      - careops-approve/**
      - .github/workflows/approve.yml
  push:
    branches:
      - main
    paths:
      - careops-approve/**
      - .github/workflows/approve.yml
  workflow_dispatch:
    inputs:
      native-attestation:
        description: Request formal signed-release qualification after native attestation capability is available; unavailable for user-owned private repos on 2026-11-06.
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: careops-approve
jobs:
  repository:
    name: repository
    timeout-minutes: 20
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate repository contracts
        shell: pwsh
        run: ./scripts/Test-Repository.ps1 -SkipRemoteTopology
  power-platform-package:
    name: power-platform-package
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select the qualified .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.402
      - name: Install Microsoft Power Platform tools
        if: ${{ hashFiles('careops-approve/src/solutions/CareOpsApprove/Other/Solution.xml') != '' }}
        uses: microsoft/powerplatform-actions/actions-install@6e91314a9c6e694ea5c894fe8c40e09d73aa892b
        with:
          pac-version-override: 2.13.1
          add-tools-to-path: true
      - name: Pack unmanaged solution
        if: ${{ hashFiles('careops-approve/src/solutions/CareOpsApprove/Other/Solution.xml') != '' }}
        uses: microsoft/powerplatform-actions/pack-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b
        with:
          solution-folder: careops-approve/src/solutions/CareOpsApprove
          solution-file: careops-approve/out/CareOpsApprove_unmanaged.zip
          solution-type: Unmanaged
      - name: Select the qualified inventory runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        id: python_runtime
        with:
          python-version: 3.15.1
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: 3.15.1
        run: |
          $helperRoot = Join-Path $env:GITHUB_WORKSPACE '.venv-careops-ci'
          if (Test-Path -LiteralPath $helperRoot) { throw 'Refusing a pre-existing helper environment.' }
          & $env:SELECTED_PYTHON -I -m venv $helperRoot
          if ($LASTEXITCODE -ne 0) { throw 'Helper environment creation failed.' }
          $helperPython = Join-Path $helperRoot 'Scripts/python.exe'
          & $helperPython -I -c 'import pathlib,platform,sys; assert platform.python_version()==sys.argv[2] and pathlib.Path(sys.prefix).resolve()==pathlib.Path(sys.argv[1]).resolve() and sys.prefix!=sys.base_prefix; print(sys.version)' $helperRoot $env:EXPECTED_PYTHON
          if ($LASTEXITCODE -ne 0) { throw 'Repository-local Python qualification failed.' }
          (Join-Path $helperRoot 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh
      - name: Read immutable qualified artifact tooling
        shell: bash
        run: |
          set -euo pipefail
          # Exact source edithatogo/careops@30df4953ea87c8915b4a525fc671a4c9857c3f7f; inherited licence retained.
          test ! -e "$GITHUB_WORKSPACE/careops-approve/.careops-ci-tools"
          cd "$GITHUB_WORKSPACE/careops-approve/.careops-security/upstream/30df4953ea87c8915b4a525fc671a4c9857c3f7f"
          sha256sum --check SHA256SUMS
          mkdir -p "$GITHUB_WORKSPACE/careops-approve/.careops-ci-tools"
          cp -R . "$GITHUB_WORKSPACE/careops-approve/.careops-ci-tools/"
      - name: Inventory the actual solution archive
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $epoch = git show -s --format=%ct $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Source timestamp unavailable.' }
          python .careops-ci-tools/portfolio-scripts/artifact_sbom.py --artifact out/CareOpsApprove_unmanaged.zip --name CareOpsApprove-unmanaged --source-commit $env:SOURCE_COMMIT --created-epoch $epoch --output out/CareOpsApprove.spdx.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual package inventory failed.' }
      - name: Include project licence and notice beside the package
        shell: pwsh
        run: Copy-Item LICENSE, NOTICE -Destination out
      - name: Retain exact package digests in the run summary
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          files = sorted(p for p in Path('out').iterdir() if p.is_file())
          assert files and Path('out/CareOpsApprove_unmanaged.zip').is_file()
          receipt = {'sourceCommit': os.environ['GITHUB_SHA'], 'files': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, 'artifactUploadExecuted': False}
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('\nPackage built and inventoried; main candidates are retained privately.\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          PYCODE
      - name: Retain private main candidate without Actions artifact storage
        id: private_candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = edithatogo/careops
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          tag="careops-approve-candidate-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" out/CareOpsApprove_unmanaged.zip out/CareOpsApprove.spdx.json out/LICENSE out/NOTICE --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "careops-approve private source candidate" --notes 'Private source candidate. Verification pending; no native deployment or operational acceptance.'
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
  attest-package:
    name: Attest main source package
    needs:
      - deliver-main
      - repository
    if: github.event_name == 'workflow_dispatch' && inputs.native-attestation == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Main-only private candidate and qualification evidence assets.
      id-token: write # Explicit main-only formal attestation qualification.
      attestations: write # Formal release gate; current private-user capability is unavailable.
    steps:
      - name: Read exact source licence and attribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the exact private candidate built by this run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.deliver-main.outputs.candidate-tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = edithatogo/careops
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
      - name: Select the qualified verification runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        id: python_runtime
        with:
          python-version: 3.15.1
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: 3.15.1
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - name: Independently compare downloaded package with its inventory
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, zipfile
          from pathlib import Path
          package = Path('candidate/CareOpsApprove_unmanaged.zip')
          document = json.loads(Path('candidate/CareOpsApprove.spdx.json').read_text())
          assert document['packages'][0]['sourceInfo'] == 'Source commit: ' + os.environ['SOURCE_COMMIT']
          assert document['packages'][0]['checksums'][0]['checksumValue'] == hashlib.sha256(package.read_bytes()).hexdigest()
          with zipfile.ZipFile(package) as archive:
              entries = [entry for entry in archive.infolist() if not entry.is_dir()]
              assert len({entry.filename for entry in entries}) == len(entries)
              actual = {entry.filename: hashlib.sha256(archive.read(entry)).hexdigest() for entry in entries}
          declared = {entry['fileName'].removeprefix('./'): next(c['checksumValue'] for c in entry['checksums'] if c['algorithm'] == 'SHA256') for entry in document['files']}
          assert actual and len(declared) == len(document['files']) and actual == declared
          for name in ('LICENSE', 'NOTICE'):
              assert Path('candidate', name).read_bytes() == Path(name).read_bytes()
          print('Exact downloaded archive and all file digests match the inventory.')
          PYCODE
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: careops-approve/candidate/CareOpsApprove_unmanaged.zip
          create-storage-record: false
      - name: Attest exact artifact inventory
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: careops-approve/candidate/CareOpsApprove_unmanaged.zip
          sbom-path: careops-approve/candidate/CareOpsApprove.spdx.json
          create-storage-record: false
      - name: Verify exact source and workflow signatures
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" candidate/build-attestation.jsonl
          cp "$SBOM_BUNDLE" candidate/sbom-attestation.jsonl
          gh attestation verify candidate/CareOpsApprove_unmanaged.zip --bundle "$PROVENANCE_BUNDLE" --repo edithatogo/careops --signer-workflow edithatogo/careops/.github/workflows/approve.yml --source-ref refs/heads/main --source-digest "$SOURCE_COMMIT" --signer-digest "$SOURCE_COMMIT" --deny-self-hosted-runners --format json > candidate/provenance-verification.json
          gh attestation verify candidate/CareOpsApprove_unmanaged.zip --bundle "$SBOM_BUNDLE" --repo edithatogo/careops --signer-workflow edithatogo/careops/.github/workflows/approve.yml --source-ref refs/heads/main --source-digest "$SOURCE_COMMIT" --signer-digest "$SOURCE_COMMIT" --deny-self-hosted-runners --predicate-type https://spdx.dev/Document/v2.3 --format json > candidate/sbom-verification.json
      - name: Retain signature evidence beside the private package
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.deliver-main.outputs.candidate-tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = edithatogo/careops
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          mkdir -p retained-signatures
          for file in candidate/*attestation.jsonl candidate/*verification.json; do
            if [ -f "$file" ]; then cp "$file" "retained-signatures/attempt-$GITHUB_RUN_ATTEMPT-$(basename "$file")"; fi
          done
          if compgen -G 'retained-signatures/*' > /dev/null; then
            gh release upload "$CANDIDATE_TAG" retained-signatures/* --repo "$GITHUB_REPOSITORY"
          fi
  deliver-main:
    name: Build main package and retain private candidate
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select the qualified .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.402
      - name: Install Microsoft Power Platform tools
        if: ${{ hashFiles('careops-approve/src/solutions/CareOpsApprove/Other/Solution.xml') != '' }}
        uses: microsoft/powerplatform-actions/actions-install@6e91314a9c6e694ea5c894fe8c40e09d73aa892b
        with:
          pac-version-override: 2.13.1
          add-tools-to-path: true
      - name: Pack unmanaged solution
        if: ${{ hashFiles('careops-approve/src/solutions/CareOpsApprove/Other/Solution.xml') != '' }}
        uses: microsoft/powerplatform-actions/pack-solution@6e91314a9c6e694ea5c894fe8c40e09d73aa892b
        with:
          solution-folder: careops-approve/src/solutions/CareOpsApprove
          solution-file: careops-approve/out/CareOpsApprove_unmanaged.zip
          solution-type: Unmanaged
      - name: Select the qualified inventory runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        id: python_runtime
        with:
          python-version: 3.15.1
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: 3.15.1
        run: |
          $helperRoot = Join-Path $env:GITHUB_WORKSPACE '.venv-careops-ci'
          if (Test-Path -LiteralPath $helperRoot) { throw 'Refusing a pre-existing helper environment.' }
          & $env:SELECTED_PYTHON -I -m venv $helperRoot
          if ($LASTEXITCODE -ne 0) { throw 'Helper environment creation failed.' }
          $helperPython = Join-Path $helperRoot 'Scripts/python.exe'
          & $helperPython -I -c 'import pathlib,platform,sys; assert platform.python_version()==sys.argv[2] and pathlib.Path(sys.prefix).resolve()==pathlib.Path(sys.argv[1]).resolve() and sys.prefix!=sys.base_prefix; print(sys.version)' $helperRoot $env:EXPECTED_PYTHON
          if ($LASTEXITCODE -ne 0) { throw 'Repository-local Python qualification failed.' }
          (Join-Path $helperRoot 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh
      - name: Read immutable qualified artifact tooling
        shell: bash
        run: |
          set -euo pipefail
          # Exact source edithatogo/careops@30df4953ea87c8915b4a525fc671a4c9857c3f7f; inherited licence retained.
          test ! -e "$GITHUB_WORKSPACE/careops-approve/.careops-ci-tools"
          cd "$GITHUB_WORKSPACE/careops-approve/.careops-security/upstream/30df4953ea87c8915b4a525fc671a4c9857c3f7f"
          sha256sum --check SHA256SUMS
          mkdir -p "$GITHUB_WORKSPACE/careops-approve/.careops-ci-tools"
          cp -R . "$GITHUB_WORKSPACE/careops-approve/.careops-ci-tools/"
      - name: Inventory the actual solution archive
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $epoch = git show -s --format=%ct $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Source timestamp unavailable.' }
          python .careops-ci-tools/portfolio-scripts/artifact_sbom.py --artifact out/CareOpsApprove_unmanaged.zip --name CareOpsApprove-unmanaged --source-commit $env:SOURCE_COMMIT --created-epoch $epoch --output out/CareOpsApprove.spdx.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual package inventory failed.' }
      - name: Include project licence and notice beside the package
        shell: pwsh
        run: Copy-Item LICENSE, NOTICE -Destination out
      - name: Retain exact package digests in the run summary
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          files = sorted(p for p in Path('out').iterdir() if p.is_file())
          assert files and Path('out/CareOpsApprove_unmanaged.zip').is_file()
          receipt = {'sourceCommit': os.environ['GITHUB_SHA'], 'files': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, 'artifactUploadExecuted': False}
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as output:
              output.write('\nPackage built and inventoried; main candidates are retained privately.\n\n```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          PYCODE
      - name: Retain private main candidate without Actions artifact storage
        id: private_candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = edithatogo/careops
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          tag="careops-approve-candidate-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" out/CareOpsApprove_unmanaged.zip out/CareOpsApprove.spdx.json out/LICENSE out/NOTICE --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "careops-approve private source candidate" --notes 'Private source candidate. Verification pending; no native deployment or operational acceptance.'
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
    permissions:
      contents: write # Main-only private candidate and qualification evidence assets.
    outputs:
      candidate-tag: ${{ steps.private_candidate.outputs.tag }}
  verify-main-candidate:
    name: Verify private main candidate bytes
    needs:
      - deliver-main
      - repository
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Main-only private candidate and qualification evidence assets.
    steps:
      - name: Read exact source licence and attribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the exact private candidate built by this run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.deliver-main.outputs.candidate-tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = edithatogo/careops
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
          test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
      - name: Select the qualified verification runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        id: python_runtime
        with:
          python-version: 3.15.1
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: 3.15.1
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - name: Independently compare downloaded package with its inventory
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, zipfile
          from pathlib import Path
          package = Path('candidate/CareOpsApprove_unmanaged.zip')
          document = json.loads(Path('candidate/CareOpsApprove.spdx.json').read_text())
          assert document['packages'][0]['sourceInfo'] == 'Source commit: ' + os.environ['SOURCE_COMMIT']
          assert document['packages'][0]['checksums'][0]['checksumValue'] == hashlib.sha256(package.read_bytes()).hexdigest()
          with zipfile.ZipFile(package) as archive:
              entries = [entry for entry in archive.infolist() if not entry.is_dir()]
              assert len({entry.filename for entry in entries}) == len(entries)
              actual = {entry.filename: hashlib.sha256(archive.read(entry)).hexdigest() for entry in entries}
          declared = {entry['fileName'].removeprefix('./'): next(c['checksumValue'] for c in entry['checksums'] if c['algorithm'] == 'SHA256') for entry in document['files']}
          assert actual and len(declared) == len(document['files']) and actual == declared
          for name in ('LICENSE', 'NOTICE'):
              assert Path('candidate', name).read_bytes() == Path(name).read_bytes()
          print('Exact downloaded archive and all file digests match the inventory.')
          PYCODE
      - name: Verify native asset digests and retain explicit qualification limits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.deliver-main.outputs.candidate-tag }}
        run: |
          set -euo pipefail
          gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json apiUrl,isDraft,targetCommitish,assets > candidate/native-release-record.json
          python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          metadata = json.loads(Path('candidate/native-release-record.json').read_text())
          assert os.environ['GITHUB_REPOSITORY'] == 'edithatogo/careops'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert metadata['isDraft'] and metadata['targetCommitish'] == os.environ['GITHUB_SHA']
          assert metadata['apiUrl'].startswith('https://api.github.com/repos/edithatogo/careops/releases/')
          files = {}
          for name in ('CareOpsApprove_unmanaged.zip', 'CareOpsApprove.spdx.json'):
              digest = hashlib.sha256((Path('candidate') / name).read_bytes()).hexdigest()
              asset = next(item for item in metadata['assets'] if item['name'] == name)
              assert asset['digest'] == 'sha256:' + digest
              files[name] = {'sha256': digest, 'assetId': asset['id']}
          receipt = {'schemaVersion': 1, 'phase': 'source-candidate-byte-verification',
              'repository': os.environ['GITHUB_REPOSITORY'], 'sourceCommit': os.environ['GITHUB_SHA'],
              'sourceRef': os.environ['GITHUB_REF'], 'runId': os.environ['GITHUB_RUN_ID'],
              'candidateTag': os.environ['CANDIDATE_TAG'], 'assets': files,
              'allArchiveFileHashesVerified': True, 'nativeAttestationExecuted': False,
              'signedReleaseQualified': False, 'nativeDeploymentQualified': False,
              'limit': 'Byte/source records only; formal signed-release qualification remains a separate required gate.'}
          Path('candidate/candidate-byte-verification.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('Native asset, source and archive inventories verified; signed release is not qualified by this job.')
          PYCODE
          mkdir -p retained-byte-evidence
          cp candidate/candidate-byte-verification.json "retained-byte-evidence/attempt-$GITHUB_RUN_ATTEMPT-candidate-byte-verification.json"
          cp candidate/native-release-record.json "retained-byte-evidence/attempt-$GITHUB_RUN_ATTEMPT-native-release-record.json"
          gh release upload "$CANDIDATE_TAG" retained-byte-evidence/* --repo "$GITHUB_REPOSITORY"
