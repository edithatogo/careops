name: Credentialing MVP contracts

on:
  pull_request:
    paths:
      - 'careops-approve'
      - 'portfolio/credentialing-mvp-compatibility.json'
      - 'portfolio/credentialing-contract-matrix.json'
      - 'portfolio/credentialing-authority-profile.example.json'
      - 'portfolio/releases/credentialing-mvp-0.1.json'
      - 'scripts/validate_credentialing_mvp.py'
      - 'scripts/validate_credentialing_authority_profile.py'
      - 'scripts/validate_credentialing_release_pins.py'
      - 'tests/fixtures/credentialing-mvp/**'
      - '.github/workflows/credentialing-mvp-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'careops-approve'
      - 'portfolio/credentialing-mvp-compatibility.json'
      - 'portfolio/credentialing-contract-matrix.json'
      - 'portfolio/credentialing-authority-profile.example.json'
      - 'portfolio/releases/credentialing-mvp-0.1.json'
      - 'scripts/validate_credentialing_mvp.py'
      - 'scripts/validate_credentialing_authority_profile.py'
      - 'scripts/validate_credentialing_release_pins.py'
      - 'tests/fixtures/credentialing-mvp/**'
      - '.github/workflows/credentialing-mvp-contracts.yml'

permissions:
  contents: read

concurrency:
  group: credentialing-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.15.1 contract and release boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python 3.15.1
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python_runtime
        with:
          python-version: '3.15.1'
      - name: Select verified repository-local Python
        env:
          SELECTED_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          if [ -e "$GITHUB_WORKSPACE/.venv-careops-ci" ] || [ -L "$GITHUB_WORKSPACE/.venv-careops-ci" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.venv-careops-ci"
          "$GITHUB_WORKSPACE/.venv-careops-ci/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-careops-ci'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.venv-careops-ci/bin" >> "$GITHUB_PATH"
      - name: Compile validators
        run: >-
          python -m compileall -q
          scripts/validate_credentialing_mvp.py
          scripts/validate_credentialing_authority_profile.py
          scripts/validate_credentialing_release_pins.py
      - name: Validate credentialing MVP contracts
        run: python scripts/validate_credentialing_mvp.py
      - name: Validate authority and source-currentness profile
        run: python scripts/validate_credentialing_authority_profile.py
      - name: Validate immutable release and gitlink pins
        run: python scripts/validate_credentialing_release_pins.py
