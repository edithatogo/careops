name: Credentialing MVP contracts

on:
  pull_request:
    paths:
      - 'careops-approve'
      - 'portfolio/credentialing-mvp-compatibility.json'
      - 'portfolio/credentialing-contract-matrix.json'
      - 'portfolio/credentialing-authority-profile.example.json'
      - 'portfolio/releases/credentialing-mvp-0.1.json'
      - 'scripts/validate_credentialing_mvp.py'
      - 'scripts/validate_credentialing_authority_profile.py'
      - 'scripts/validate_credentialing_release_pins.py'
      - 'tests/fixtures/credentialing-mvp/**'
      - '.github/workflows/credentialing-mvp-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'careops-approve'
      - 'portfolio/credentialing-mvp-compatibility.json'
      - 'portfolio/credentialing-contract-matrix.json'
      - 'portfolio/credentialing-authority-profile.example.json'
      - 'portfolio/releases/credentialing-mvp-0.1.json'
      - 'scripts/validate_credentialing_mvp.py'
      - 'scripts/validate_credentialing_authority_profile.py'
      - 'scripts/validate_credentialing_release_pins.py'
      - 'tests/fixtures/credentialing-mvp/**'
      - '.github/workflows/credentialing-mvp-contracts.yml'

permissions:
  contents: read

concurrency:
  group: credentialing-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.14 contract and release boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Compile validators
        run: >-
          python -m compileall -q
          scripts/validate_credentialing_mvp.py
          scripts/validate_credentialing_authority_profile.py
          scripts/validate_credentialing_release_pins.py
      - name: Validate credentialing MVP contracts
        run: python scripts/validate_credentialing_mvp.py
      - name: Validate authority and source-currentness profile
        run: python scripts/validate_credentialing_authority_profile.py
      - name: Validate immutable release and gitlink pins
        run: python scripts/validate_credentialing_release_pins.py
