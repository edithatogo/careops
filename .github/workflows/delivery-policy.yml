name: Delivery policy
on:
  pull_request:
    paths: ['.careops/**', 'portfolio/delivery-catalog.json', 'portfolio-scripts/validate_delivery.py', 'portfolio-scripts/inventory_dependencies.py', 'portfolio-scripts/checks/test_delivery_profiles.py', '.github/workflows/delivery-policy.yml']
  push:
    branches: [main]
    paths: ['.careops/**', 'portfolio/delivery-catalog.json', 'portfolio-scripts/validate_delivery.py', 'portfolio-scripts/inventory_dependencies.py', 'portfolio-scripts/checks/test_delivery_profiles.py', '.github/workflows/delivery-policy.yml']
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Delivery profiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - run: python portfolio-scripts/validate_delivery.py
      - run: python -m unittest discover -s portfolio-scripts/checks -p test_delivery_profiles.py -v
