version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      non-major-actions:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    # Parent requirements only; child modules retain their own update ownership.
    exclude-paths:
      - "modules/**"
      - "careops-approve/**"
      - ".agents/**"
      - ".local/**"
      - "tests/**"
    schedule:
      interval: weekly
    groups:
      ci-tools:
        update-types: [minor, patch]
