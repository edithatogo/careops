# REVIEWABLE POWER APPS SOURCE SPECIFICATION; not Power Apps Studio validated
Screens:
  ReviewCase:
    Children:
    - Title:
        Control: Label@2.5.1
        Properties:
          Text: = "Review proposed revision"
          X: =24
          Y: =20
          Width: =920
          Height: =42
          Size: =16
    - Warning:
        Control: Label@2.5.1
        Properties:
          Text: = "Verify industrial rules, consultation and delegated authority before
            decision"
          X: =24
          Y: =80
          Width: =920
          Height: =42
          Size: =16
    - Compare:
        Control: Button@0.0.45
        Properties:
          Text: ="Compare versions"
          OnSelect: =Navigate(VersionComparison)
          X: =24
          Y: =160
          Width: =220
          Height: =42
          AccessibleLabel: ="Compare versions"
    - Approve:
        Control: Button@0.0.45
        Properties:
          Text: ="Approve (delegated)"
          OnSelect: =Notify("Awaiting server-enforced approval flow binding",NotificationType.Warning)
          X: =24
          Y: =230
          Width: =220
          Height: =42
          AccessibleLabel: ="Approve (delegated)"
    - Return:
        Control: Button@0.0.45
        Properties:
          Text: ="Return for changes"
          OnSelect: =Notify("Awaiting server-enforced decision flow binding",NotificationType.Warning)
          X: =24
          Y: =290
          Width: =220
          Height: =42
          AccessibleLabel: ="Return for changes"
    - Back:
        Control: Button@0.0.45
        Properties:
          Text: ="Queue"
          OnSelect: =Navigate(ApproverDashboard)
          X: =24
          Y: =365
          Width: =220
          Height: =42
          AccessibleLabel: ="Queue"
