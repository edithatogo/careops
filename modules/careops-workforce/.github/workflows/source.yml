name: Public dashboard source
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.1'
      - name: Verify clean source export
        shell: bash
        run: |
          set -euo pipefail
          exported="$(mktemp -d)"
          trap 'rm -rf -- "$exported"' EXIT
          git archive HEAD | tar -xf - -C "$exported"
          python "$exported/alm.py"
