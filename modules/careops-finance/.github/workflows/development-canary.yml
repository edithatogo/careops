name: PowerShell development canary
on:
  schedule:
    - cron: '19 6 * * 3'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finance-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    name: Official preview source qualification
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve and verify official preview runtime
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/Resolve-PowerShellPreview.ps1 -OutputDirectory .local/powershell-preview
      - name: Run existing source and quality gates on preview
        id: qualification
        shell: pwsh
        env:
          PREVIEW_EXECUTABLE: ${{ steps.runtime.outputs.executable }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = $env:PREVIEW_EXECUTABLE
          foreach ($mode in @('RepositoryHygiene', 'SourceControlReady')) {
            & $exe -NoProfile -File ./scripts/Invoke-Validation.ps1 -Mode $mode -SkipPowerBiCli
            if ($LASTEXITCODE -ne 0) { throw "Preview validation failed: $mode" }
          }
          foreach ($technique in @('property-based', 'mutation', 'contract', 'metamorphic')) {
            & $exe -NoProfile -File ./scripts/Run-QualityChecks.ps1 -Technique $technique
            if ($LASTEXITCODE -ne 0) { throw "Preview quality check failed: $technique" }
          }
      - name: Record terminal qualification scope
        if: always()
        shell: pwsh
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
        run: |
          New-Item -ItemType Directory -Force .local/powershell-preview | Out-Null
          @{
            sourceCommit = $env:GITHUB_SHA
            runtimeOutcome = $env:RUNTIME_OUTCOME
            sourceValidationOutcome = $env:QUALIFICATION_OUTCOME
            promoted = $false
            nativeWrites = $false
            scope = 'existing offline source gates only; no Power BI runtime or deployment acceptance'
          } | ConvertTo-Json | Set-Content .local/powershell-preview/outcome.json
      - name: Retain exact candidate and terminal outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finance-powershell-preview-${{ github.run_id }}
          path: .local/powershell-preview/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
