name: codeql

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload applicable source analysis only.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check for JavaScript/TypeScript sources
        id: codeql_scan
        shell: bash
        run: |
          if [[ -n "$(find . -type f \( -name "*.js" -o -name "*.jsx" -o -name "*.ts" -o -name "*.tsx" \) -print -quit)" ]]; then
            echo "has_js=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_js=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        if: ${{ steps.codeql_scan.outputs.has_js == 'true' }}
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        if: ${{ steps.codeql_scan.outputs.has_js == 'true' }}
