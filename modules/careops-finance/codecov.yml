coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1
        if_not_found: fail
    patch:
      default:
        target: auto
        threshold: 1
        if_not_found: fail
  precision: 2
  round: down
  range: 70..100
  notify:
    after_n_builds: 2
    wait_for_ci: false
codecov:
  require_ci_to_pass: false
  notify:
    wait_for_ci: false
ignore:
  - 'data/**'
  - '.tmp/**'
